name: Lint skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-skill-tools:
    name: Skill tool-list lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill frontmatter tool lists
        run: python3 scripts/lint_skill_tools.py
